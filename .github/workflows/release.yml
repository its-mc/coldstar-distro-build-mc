name: Build and Release Coldstar

on:
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # Build Rust binaries for all platforms
  # ============================================================================
  build-binaries:
    name: Build ${{ matrix.platform.os }}-${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60  # Prevent infinite hangs
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux builds
          - { os: linux, arch: x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: .so }
          - { os: linux, arch: aarch64, runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, ext: .so }
          
          # macOS builds (ARM64 only - Apple Silicon)
          - { os: macos, arch: arm64, runner: macos-14, target: aarch64-apple-darwin, ext: .dylib }
          
          # Windows builds
          - { os: windows, arch: x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, ext: .dll }
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            secure_signer/target
          key: ${{ runner.os }}-cargo-${{ matrix.platform.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.platform.target }}-
      
      - name: Build Rust signer (release)
        working-directory: secure_signer
        run: |
          cargo build --release --target ${{ matrix.platform.target }} --features ffi
          cargo build --release --target ${{ matrix.platform.target }} --bin solana-signer
      
      - name: Strip binaries (Unix)
        if: runner.os != 'Windows'
        working-directory: secure_signer
        run: |
          strip target/${{ matrix.platform.target }}/release/libsolana_secure_signer${{ matrix.platform.ext }} || true
          strip target/${{ matrix.platform.target }}/release/solana-signer || true
      
      - name: Create artifact directory
        run: mkdir -p artifacts
      
      - name: Copy binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          cp secure_signer/target/${{ matrix.platform.target }}/release/libsolana_secure_signer${{ matrix.platform.ext }} artifacts/
          cp secure_signer/target/${{ matrix.platform.target }}/release/solana-signer artifacts/
      
      - name: Copy binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          copy secure_signer\target\${{ matrix.platform.target }}\release\solana_secure_signer.dll artifacts\
          copy secure_signer\target\${{ matrix.platform.target }}\release\solana-signer.exe artifacts\
      
      - name: Generate checksums
        working-directory: artifacts
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            certutil -hashfile libsolana_secure_signer${{ matrix.platform.ext }} SHA256 > libsolana_secure_signer${{ matrix.platform.ext }}.sha256 || true
            certutil -hashfile solana_secure_signer.dll SHA256 > solana_secure_signer.dll.sha256 || true
            certutil -hashfile solana-signer.exe SHA256 > solana-signer.exe.sha256 || true
          elif [ "$RUNNER_OS" == "macOS" ]; then
            shasum -a 256 * > checksums.txt
          else
            sha256sum * > checksums.txt
          fi
        shell: bash
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coldstar-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: artifacts/*
          retention-days: 7
  
  # ============================================================================
  # Security scanning
  # ============================================================================
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cargo audit (Rust dependencies)
        run: |
          cargo install cargo-audit
          cd secure_signer
          cargo audit --deny warnings
      
      - name: Safety check (Python dependencies)
        run: |
          pip install safety
          safety check -r local_requirements.txt --json
        continue-on-error: true  # Don't fail on warnings
  
  # ============================================================================
  # Build Docker image and push to registry (DISABLED - needs fix)
  # ============================================================================
  # build-docker:
  #   name: Build Docker Image
  #   runs-on: ubuntu-latest
  #   needs: [build-binaries]
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #     
  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3
  #     
  #     - name: Log in to GitHub Container Registry
  #       uses: docker/login-action@v3
  #       with:
  #         registry: ghcr.io
  #         username: ${{ github.actor }}
  #         password: ${{ secrets.GITHUB_TOKEN }}
  #     
  #     - name: Extract version from tag
  #       id: version
  #       run: |
  #         if [[ "${{ github.ref }}" == refs/tags/* ]]; then
  #           echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
  #         else
  #           echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
  #         fi
  #     
  #     - name: Build and push Docker image
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: .
  #         push: true
  #         tags: |
  #           ghcr.io/${{ github.repository }}:latest
  #           ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max
  #         platforms: linux/amd64,linux/arm64
  
  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, security-scan]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create compressed archives
        run: |
          cd release-artifacts
          for dir in coldstar-*/; do
            platform=$(basename "$dir")
            tar -czf "${platform}.tar.gz" -C "$dir" .
          done
      
      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Coldstar ${{ steps.version.outputs.version }}
          
          ### Installation
          
          **macOS (Homebrew):**
          ```bash
          brew tap coldstar/tap
          brew install coldstar
          ```
          
          **Linux (direct download):**
          ```bash
          curl -sSL https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/coldstar-linux-x86_64.tar.gz | tar xz
          sudo mv coldstar /usr/local/bin/
          ```
          
          **Windows (Winget):**
          ```powershell
          winget install Coldstar.Coldstar
          ```
          
          **Python (pip):**
          ```bash
          pip install coldstar
          ```
          
          ### What's Included
          
          Pre-compiled binaries for:
          - ✅ Linux (x86_64, ARM64)
          - ✅ macOS (Apple Silicon)
          - ✅ Windows (x86_64)
          
          ### Checksums
          
          See individual `.sha256` files in each platform archive.
          
          ### Security
          
          - All binaries built in isolated GitHub Actions runners
          - Rust dependencies audited with `cargo audit`
          - Python dependencies checked with `safety`
          - Docker image scanned for vulnerabilities
          
          ### Documentation
          
          - [README](https://github.com/${{ github.repository }}#readme)
          - [Architecture](https://github.com/${{ github.repository }}/blob/main/ARCHITECTURE.md)
          - [Security Model](https://github.com/${{ github.repository }}/blob/main/SECURE_SIGNER_README.md)
          
          EOF
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Coldstar ${{ steps.version.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
